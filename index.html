<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ASL Two-Hand Tracker | TF.js</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', monospace; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    .ui {
      position: absolute; inset: 0; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    #loading {
      color: #ccf4ff; font-size: 1.4rem; font-weight: 500;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
      padding: 1rem 2rem; border-radius: 48px;
      border: 1px solid rgba(0,255,200,0.4);
      box-shadow: 0 0 15px rgba(0,255,200,0.3);
      transition: opacity 0.3s;
    }
    .hint {
      position: absolute; bottom: 20px; left: 0; right: 0; text-align: center;
      color: rgba(200,220,255,0.6); font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="ui">
    <div id="loading">Loading camera and model...</div>
  </div>
  <div class="hint">Show one or both hands. Letters appear only when the model is confident.</div>
  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const loading = document.getElementById('loading');

      let model = null;
      let labelMap = {};
      let modelReady = false;

      // Temporal smoothing state per detected hand (index 0 or 1)
      const handHistories = [[], []];
      const HISTORY_SIZE = 10;
      const VOTE_THRESHOLD = 7;
      const CONFIDENCE_THRESHOLD = 0.85;
      const lastStableLetter = [null, null];
      const lastWristPos = [{x:0,y:0}, {x:0,y:0}];

      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize);
      resize();

      async function initModel() {
        try {
            model = await tf.loadLayersModel('./asl_tfjs_model/model.json');
            const resp = await fetch('./label_map.json');
            labelMap = await resp.json();
            modelReady = true;
            console.log('[ASL] TF.js model loaded.');
        } catch (e) {
            console.error('[ASL] Model load failed:', e);
            loading.textContent = 'Model failed to load. Check console.';
        }
      }

      /**
       * Extracts translation-invariant, scale-invariant, and orientation-aware
       * features to resolve ASL structural confusions (e.g., E vs M, R vs K,
       * H vs G, P vs Q). Must stay in sync with the Python training pipeline.
       */
      function extractRobustFeatures(landmarks) {
        const wrist = landmarks[0];
        let lmCentered = landmarks.map(p => [p.x - wrist.x, p.y - wrist.y, p.z - wrist.z]);

        const mKnuckle = lmCentered[9];
        const scale = Math.hypot(mKnuckle[0], mKnuckle[1], mKnuckle[2]) || 1.0;
        let lmScaled = lmCentered.map(p => [p[0] / scale, p[1] / scale, p[2] / scale]);

        // Structural distances capture fist tightness and finger curl (E vs M, R vs K)
        const fingerTips = [4, 8, 12, 16, 20];
        const knuckles = [2, 5, 9, 13, 17];
        let distances = [];

        fingerTips.forEach(tip => {
          const p = lmScaled[tip];
          distances.push(Math.hypot(p[0], p[1], p[2]));
        });

        for (let i = 0; i < fingerTips.length; i++) {
          const tip = lmScaled[fingerTips[i]];
          const knuck = lmScaled[knuckles[i]];
          distances.push(Math.hypot(tip[0] - knuck[0], tip[1] - knuck[1], tip[2] - knuck[2]));
        }

        // Orientation vectors capture hand rotation and pitch (H vs G, P vs Q)
        const v5_0 = [lmScaled[5][0] - lmScaled[0][0], lmScaled[5][1] - lmScaled[0][1], lmScaled[5][2] - lmScaled[0][2]];
        const v17_0 = [lmScaled[17][0] - lmScaled[0][0], lmScaled[17][1] - lmScaled[0][1], lmScaled[17][2] - lmScaled[0][2]];
        
        let palmNormal = [
          v5_0[1] * v17_0[2] - v5_0[2] * v17_0[1],
          v5_0[2] * v17_0[0] - v5_0[0] * v17_0[2],
          v5_0[0] * v17_0[1] - v5_0[1] * v17_0[0]
        ];
        const normLen = Math.hypot(palmNormal[0], palmNormal[1], palmNormal[2]) || 1.0;
        palmNormal = palmNormal.map(v => v / normLen);

        let handDirection = [lmScaled[9][0] - lmScaled[0][0], lmScaled[9][1] - lmScaled[0][1], lmScaled[9][2] - lmScaled[0][2]];
        const dirLen = Math.hypot(handDirection[0], handDirection[1], handDirection[2]) || 1.0;
        handDirection = handDirection.map(v => v / dirLen);

        // Flatten into a single 82-item vector: 63 coords + 10 distances + 3 normal + 3 direction
        let flatFeatures = [];
        lmScaled.forEach(p => flatFeatures.push(...p));
        flatFeatures.push(...distances);
        flatFeatures.push(...palmNormal);
        flatFeatures.push(...handDirection);

        return flatFeatures;
      }

      function smoothLetter(handIdx, letter) {
        const hist = handHistories[handIdx];
        if (letter !== null) hist.push(letter);
        if (hist.length > HISTORY_SIZE) hist.shift();

        const counts = {};
        let best = null, bestCount = 0;
        for (const l of hist) {
          if (l === null) continue;
          counts[l] = (counts[l] || 0) + 1;
          if (counts[l] > bestCount) {
            bestCount = counts[l];
            best = l;
          }
        }
        return (bestCount >= VOTE_THRESHOLD) ? best : null;
      }

      function drawCam(img) {
        if (!img || img.width === 0) return false;
        const w = canvas.width, h = canvas.height;
        const a = img.width / img.height, ca = w / h;
        let dw, dh, dx, dy;
        if (ca > a) { dw = w; dh = w / a; dx = 0; dy = (h - dh) / 2; }
        else { dh = h; dw = h * a; dx = (w - dw) / 2; dy = 0; }
        ctx.save();
        ctx.translate(w, 0); ctx.scale(-1, 1);
        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.restore();
        return true;
      }

      function drawSkeleton(landmarks) {
        const m = landmarks.map(p => ({ x: 1 - p.x, y: p.y, z: p.z }));
        drawConnectors(ctx, m, HAND_CONNECTIONS, {
          color: '#2effb0', lineWidth: 2.3, shadowBlur: 5, shadowColor: '#1effbc'
        });
        drawLandmarks(ctx, m, {
          color: '#ffd966', lineWidth: 1.2, radius: 3.2, fillColor: '#ffb347'
        });
      }

      function drawLabel(letter, x, y) {
        ctx.save();
        ctx.font = 'bold 52px "Segoe UI", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#0affd0';
        ctx.shadowBlur = 20;
        ctx.fillText(letter, x, y - 20);
        ctx.restore();
      }

      async function onResults(results) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.image) drawCam(results.image);
        else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height); }

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          for (let i = 0; i < results.multiHandLandmarks.length; i++) {
            const lm = results.multiHandLandmarks[i];

            drawSkeleton(lm);

            const wx = (1 - lm[0].x) * canvas.width;
            const wy = lm[0].y * canvas.height;
            lastWristPos[i] = { x: wx, y: wy };

            // Run inference inside tf.tidy to prevent GPU memory leaks
            if (modelReady && model) {
              tf.tidy(() => {
                const features = extractRobustFeatures(lm);
                const input = tf.tensor2d([features]);

                const output = model.predict(input);
                const probs = output.dataSync(); 
                const maxProb = Math.max(...probs);
                const predIndex = probs.indexOf(maxProb);

                let letter = null;
                if (maxProb >= CONFIDENCE_THRESHOLD) {
                  letter = labelMap[predIndex];
                }

                if (letter) {
                  const stable = smoothLetter(i, letter);
                  if (stable) lastStableLetter[i] = stable;
                }
              });
            }
          }

          for (let i = 0; i < results.multiHandLandmarks.length; i++) {
            if (lastStableLetter[i]) {
              drawLabel(lastStableLetter[i], lastWristPos[i].x, lastWristPos[i].y);
            }
          }
        } else {
          // Reset histories when hands leave frame to avoid stale predictions
          handHistories[0] = []; handHistories[1] = [];
          lastStableLetter[0] = null; lastStableLetter[1] = null;
        }

        if (modelReady) {
          loading.style.opacity = '0';
          setTimeout(() => loading.style.display = 'none', 300);
        }
      }

      async function init() {
        await initModel();

        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
          maxNumHands: 2,
          modelComplexity: 1,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        const video = document.createElement('video');
        const cam = new Camera(video, {
          onFrame: async () => { await hands.send({ image: video }); },
          width: { ideal: 1280 }, height: { ideal: 720 }
        });
        cam.start()
          .then(() => { console.log('[ASL] Camera active'); })
          .catch(err => {
            console.error('[ASL] Camera error:', err);
            loading.textContent = 'Camera error: ' + err.message;
          });
      }

      window.addEventListener('beforeunload', () => {
        if (model) model.dispose();
      });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
