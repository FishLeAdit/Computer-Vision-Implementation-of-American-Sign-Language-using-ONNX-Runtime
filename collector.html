<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASL Dataset Collector | Phase 1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', monospace; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    .ui {
      position: absolute; inset: 0; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    .top {
      text-align: center; margin-top: 8vh;
      text-shadow: 0 0 20px rgba(0, 255, 200, 0.4);
    }
    .letter {
      font-size: clamp(4rem, 12vw, 10rem);
      font-weight: 700; color: #fff; letter-spacing: 2px;
    }
    .count {
      font-size: 1.3rem; color: #0affd0; margin-top: 0.5rem;
    }
    .rec {
      position: absolute; top: 24px; right: 24px;
      width: 18px; height: 18px; border-radius: 50%;
      background: #ff3333; box-shadow: 0 0 12px #ff3333;
      opacity: 0; transition: opacity 0.2s;
    }
    .rec.on { opacity: 1; animation: pulse 0.8s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

    .hint {
      text-align: center; color: rgba(255,255,255,0.55);
      font-size: 0.9rem; margin-bottom: 100px; line-height: 1.5;
    }

    .controls {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; pointer-events: auto; align-items: center;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(10px);
      padding: 10px 18px; border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    button, select {
      background: #141414; color: #eee; border: 1px solid #2a2a2a;
      padding: 10px 16px; border-radius: 10px; cursor: pointer;
      font-family: inherit; font-size: 0.95rem;
    }
    button:hover { border-color: #0affd0; color: #fff; }
    button:active { transform: scale(0.96); }
    #btnCap { background: #0affd0; color: #000; font-weight: 600; border-color: #0affd0; }
    #btnCap.recording { background: #ff3333; color: #fff; border-color: #ff3333; }
    #btnDL { border-color: #0affd0; }
  </style>
</head>
<body>

  <div class="ui">
    <div class="rec" id="recInd"></div>
    <div class="top">
      <div class="letter" id="letterDisp">A</div>
      <div class="count" id="countDisp">0 / 80 frames</div>
    </div>
    <div class="hint">
      Hold SPACE (or click CAPTURE) to record.&nbsp;&nbsp;← → to switch letters.<br>
      While recording, slowly vary distance, angle, and height.
    </div>
    <div class="controls">
      <button id="btnPrev">←</button>
      <button id="btnCap">CAPTURE</button>
      <button id="btnNext">→</button>
      <select id="handSel">
        <option value="right">Right Hand</option>
        <option value="left">Left Hand</option>
      </select>
      <button id="btnDL">Download CSV</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      let idx = 0;
      let recording = false;
      const dataset = [];
      const TARGET = 80;

      const elLetter = document.getElementById('letterDisp');
      const elCount  = document.getElementById('countDisp');
      const elRec    = document.getElementById('recInd');
      const elHand   = document.getElementById('handSel');
      const btnCap   = document.getElementById('btnCap');

      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize);
      resize();

      function currentCount() {
        return dataset.filter(r => r.letter === letters[idx] && r.hand === elHand.value).length;
      }

      function updateUI() {
        elLetter.textContent = letters[idx];
        const c = currentCount();
        elCount.textContent = `${c} / ${TARGET} frames`;
        elRec.classList.toggle('on', recording);
        btnCap.textContent = recording ? 'RECORDING…' : 'CAPTURE';
        btnCap.classList.toggle('recording', recording);
        if (recording && c >= TARGET) { recording = false; updateUI(); }
      }

      function drawCam(img) {
        if (!img || img.width === 0) return;
        const w = canvas.width, h = canvas.height;
        const a = img.width / img.height, ca = w / h;
        let dw, dh, dx, dy;
        if (ca > a) { dw = w; dh = w / a; dx = 0; dy = (h - dh) / 2; }
        else { dh = h; dw = h * a; dx = (w - dw) / 2; dy = 0; }
        ctx.save();
        ctx.translate(w, 0); ctx.scale(-1, 1);
        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.restore();
      }

      function drawSkeleton(lm) {
        const m = lm.map(p => ({ x: 1 - p.x, y: p.y, z: p.z }));
        drawConnectors(ctx, m, HAND_CONNECTIONS, { color: '#2effb0', lineWidth: 2.2, shadowBlur: 4, shadowColor: '#1effbc' });
        drawLandmarks(ctx, m, { color: '#ffd966', lineWidth: 1, radius: 3, fillColor: '#ffb347' });
      }

      function onResults(results) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (results.image) drawCam(results.image);
        else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height); }

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const lm = results.multiHandLandmarks[0];
          drawSkeleton(lm);

          if (recording) {
            dataset.push({
              letter: letters[idx],
              hand: elHand.value,
              landmarks: lm.map(p => [p.x, p.y, p.z])
            });
            updateUI();
          }
        }
        if (!recording) updateUI();
      }

      function prev() { idx = (idx - 1 + 26) % 26; updateUI(); }
      function next() { idx = (idx + 1) % 26; updateUI(); }
      function toggleRec() { recording = !recording; updateUI(); }

      document.getElementById('btnPrev').addEventListener('click', prev);
      document.getElementById('btnNext').addEventListener('click', next);
      document.getElementById('btnCap').addEventListener('click', toggleRec);
      elHand.addEventListener('change', updateUI);

      window.addEventListener('keydown', e => {
        if (e.code === 'ArrowLeft') prev();
        if (e.code === 'ArrowRight') next();
        if (e.code === 'Space') { e.preventDefault(); toggleRec(); }
      });

      document.getElementById('btnDL').addEventListener('click', () => {
        if (!dataset.length) { alert('No data recorded yet.'); return; }
        let csv = 'letter,hand';
        for (let i = 0; i < 21; i++) csv += `,x${i},y${i},z${i}`;
        csv += '\n';
        dataset.forEach(row => {
          let line = `${row.letter},${row.hand}`;
          row.landmarks.forEach(p => { line += `,${p[0]},${p[1]},${p[2]}`; });
          csv += line + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `asl_raw_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      });

      const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
      hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
      hands.onResults(onResults);

      const video = document.createElement('video');
      const cam = new Camera(video, {
        onFrame: async () => { await hands.send({ image: video }); },
        width: { ideal: 1280 }, height: { ideal: 720 }
      });
      cam.start().then(() => updateUI()).catch(err => alert('Camera error: ' + err.message));
    })();
  </script>
</body>
</html>
